name: Discord Commit Notifier

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ toJson(github.event) }}
        run: |
          COMMITS=$(echo "$EVENT" | jq -r '.commits[] | "- [`\(.id[0:7])`](\(.url)) \(.message)"')

          curl -X POST -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg title "🚀 New push to $BRANCH" \
            --arg url "https://github.com/$REPO" \
            --arg repo "$REPO" \
            --arg actor "$ACTOR" \
            --arg commits "$COMMITS" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: 5793266,
                fields: [
                  { "name": "Repository", "value": $repo, "inline": true },
                  { "name": "Author", "value": $actor, "inline": true },
                  { "name": "Commits", "value": $commits }
                ],
                footer: { "text": "GitHub → Discord" },
                timestamp: (now | todate)
              }]
            }')" \
          "$WEBHOOK"
